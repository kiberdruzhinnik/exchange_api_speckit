[package]
name = "exchange-api"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "REST API for MOEX ticker history"
license = "UNLICENSED"

[lib]
name = "exchange_api"
path = "src/lib.rs"

[[bin]]
name = "exchange-api"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
axum = "0.8.9"
bytes = "1"
chrono = { version = "0.4.45", features = ["serde"] }
chrono-tz = { version = "0.10", features = ["serde"] }
moka = { version = "0.12", features = ["future"] }
quick-xml = { version = "0.41.0", features = ["serialize", "encoding"] }
reqwest = { version = "0.13.5", default-features = false, features = ["query", "rustls", "stream"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio-rustls", "sqlite"] }
thiserror = "2.0.21"
tokio = { version = "1.53.2", features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tower-http = { version = "0.7.1", features = ["trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt"] }

[dev-dependencies]
http-body-util = "0.1"
tower = { version = "0.5.3", features = ["util"] }
wiremock = "0.6.5"
tempfile = "3"
serde_yaml = "0.9"
