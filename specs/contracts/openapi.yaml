openapi: 3.1.0
info:
  title: Exchange API
  version: 1.0.0
  description: |-
    Canonical REST contract for MOEX, SPBEX, and Bank of Russia currency rates.
    History is retained indefinitely in the persistent store. Each history request fetches
    records newer than the latest retained record and returns the complete merged history.
    The service also full-refreshes every retained provider/symbol collection in the
    background. The cadence is controlled by EXCHANGE_API_HISTORY_FULL_REFRESH_INTERVAL_SECS
    (positive seconds; default 604800). Retryable background failures include transport
    errors, HTTP 408, 425, 429, 5xx, and invalid or incomplete data; retries use capped
    exponential backoff configured by EXCHANGE_API_HISTORY_REFRESH_RETRY_MAX_BACKOFF_SECS
    (positive seconds; default 900). Invalid full responses preserve last-good history.
servers:
  - url: /
paths:
  /v2/history/{PROVIDER}/{SYMBOL}:
    get:
      operationId: getProviderHistoryV2
      summary: Get complete history for a provider symbol
      description: Returns the selected provider's complete retained history, preserving its existing mappings, ordering, incremental refresh behavior, and error outcomes.
      parameters:
        - $ref: '#/components/parameters/Provider'
        - $ref: '#/components/parameters/Symbol'
      responses:
        '200':
          description: Complete ordered history, or an empty array when no records are available.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DailyMarketRecord'
        '400':
          $ref: '#/components/responses/InvalidV2PathParameter'
        '502':
          $ref: '#/components/responses/ProviderUnavailable'
        '503':
          $ref: '#/components/responses/HistoryStoreUnavailable'
  /v2/quote/{PROVIDER}/{SYMBOL}:
    get:
      operationId: getProviderCurrentQuoteV2
      summary: Get the current quote for a provider symbol
      description: Fetches a current quote according to the selected provider's existing meaning and freshness behavior. Quote responses are not cached.
      parameters:
        - $ref: '#/components/parameters/Provider'
        - $ref: '#/components/parameters/Symbol'
      responses:
        '200':
          description: Exactly one current quote record, including the provider's existing no-data representation.
          content:
            application/json:
              schema:
                type: array
                minItems: 1
                maxItems: 1
                items:
                  $ref: '#/components/schemas/LatestQuoteRecord'
        '400':
          $ref: '#/components/responses/InvalidV2PathParameter'
        '502':
          $ref: '#/components/responses/ProviderUnavailable'
  /v2/admin/cache/clear/{PROVIDER}/{SYMBOL}:
    delete:
      operationId: clearProviderSymbolHistory
      summary: Clear cached history for one provider symbol
      description: Removes the selected provider/symbol durable history collection. A later history request can fetch and retain the history again. Configure EXCHANGE_API_ADMIN_API_KEY to enable this operation.
      security:
        - AdminApiKey: []
      parameters:
        - $ref: '#/components/parameters/Provider'
        - $ref: '#/components/parameters/Symbol'
      responses:
        '204':
          description: Cache cleared or no cached entry existed.
        '400':
          $ref: '#/components/responses/InvalidV2PathParameter'
        '401':
          $ref: '#/components/responses/AdminUnauthorized'
        '503':
          $ref: '#/components/responses/AdminUnavailable'
components:
  securitySchemes:
    AdminApiKey:
      type: apiKey
      in: header
      name: X-API-Key
  parameters:
    Provider:
      name: PROVIDER
      in: path
      required: true
      description: Selects the data source and provider-specific behavior.
      schema:
        type: string
        enum: [moex, spbex, cbr]
    Symbol:
      name: SYMBOL
      in: path
      required: true
      description: Ticker or currency code. The selected provider applies its existing normalization and validation rules.
      schema:
        type: string
        minLength: 1
    MoexSymbol:
      name: SYMBOL
      in: path
      required: true
      description: MOEX instrument identifier; examples include IMOEX and GLDRUB_TOM. Surrounding whitespace is trimmed and letters are uppercased before validation. Underscores may separate alphanumeric parts, with no leading, trailing, or repeated underscores.
      schema:
        type: string
        minLength: 1
        pattern: '^(?:[A-Za-z0-9.-]+|[A-Za-z0-9]+(?:_[A-Za-z0-9]+)+)$'
    SpbexSymbol:
      name: SYMBOL
      in: path
      required: true
      description: SPBEX instrument symbol; surrounding whitespace is trimmed and letters are uppercased before provider validation.
      schema:
        type: string
        minLength: 1
        pattern: '^[A-Za-z0-9._-]+$'
    CbrSymbol:
      name: SYMBOL
      in: path
      required: true
      description: Supported Bank of Russia ISO currency code; surrounding whitespace is trimmed and letters are uppercased before support validation.
      schema:
        type: string
        minLength: 3
        maxLength: 3
        pattern: '^[A-Za-z]{3}$'
  schemas:
    DailyMarketRecord:
      type: object
      additionalProperties: false
      required: [date, close, high, low, volume, facevalue]
      properties:
        date:
          type: string
          format: date-time
          description: Source effective date or trading date at UTC midnight.
          example: '2013-03-25T00:00:00Z'
        close:
          type: [number, 'null']
          description: Provider-specific normalized closing value; null when unavailable.
        high:
          type: [number, 'null']
          description: Provider-specific daily high; null when unavailable.
        low:
          type: [number, 'null']
          description: Provider-specific daily low; null when unavailable.
        volume:
          type: [number, 'null']
          description: Traded volume when supplied; null when unavailable.
        facevalue:
          type: [number, 'null']
          description: Provider-specific face value, lot size, nominal, or constant when specified; null when unavailable.
    LatestQuoteRecord:
      type: object
      additionalProperties: false
      required: [date, close, high, low, volume, facevalue]
      properties:
        date:
          type: [string, 'null']
          format: date-time
          description: Provider event/effective time in UTC; null when a successful lookup has no quote.
        close:
          type: [number, 'null']
          description: Provider-specific quote value; null when a successful lookup has no quote.
        high:
          type: [number, 'null']
          description: Quote high where applicable; otherwise null.
        low:
          type: [number, 'null']
          description: Quote low where applicable; otherwise null.
        volume:
          type: [number, 'null']
          description: Trade size where applicable; otherwise null.
        facevalue:
          type: [number, 'null']
          description: Provider-specific value where applicable; otherwise null.
    ErrorResponse:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: object
          additionalProperties: false
          required: [code, message]
          properties:
            code:
              type: string
              description: "`invalid_provider` and `invalid_symbol` are shared client errors; upstream errors retain provider-specific codes on both API versions."
              examples: [invalid_provider, invalid_symbol, moex_unavailable, spbex_unavailable, cbr_unavailable, history_store_unavailable]
            message:
              type: string
              description: Client-actionable message that does not expose internal diagnostics.
  responses:
    AdminUnauthorized:
      description: Missing or incorrect X-API-Key header (HTTP 401).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: unauthorized
              message: A valid X-API-Key header is required
    AdminUnavailable:
      description: The admin API key is not configured or the persistent history store is unavailable (HTTP 503).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            keyNotConfigured:
              value:
                error:
                  code: admin_api_key_unconfigured
                  message: The administrative endpoint is not configured
            storeUnavailable:
              value:
                error:
                  code: history_store_unavailable
                  message: Ticker history is temporarily unavailable
    InvalidV2PathParameter:
      description: Provider or symbol path value is invalid (HTTP 400).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            invalidProvider:
              value:
                error:
                  code: invalid_provider
                  message: Provider is unsupported
            invalidSymbol:
              value:
                error:
                  code: invalid_symbol
                  message: Symbol is malformed or unsupported
    ProviderUnavailable:
      description: The selected provider failed or returned unusable data (HTTP 502); the existing provider-specific code is retained.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            moex:
              value:
                error:
                  code: moex_unavailable
                  message: MOEX market data is temporarily unavailable
            spbex:
              value:
                error:
                  code: spbex_unavailable
                  message: SPBEX market data is temporarily unavailable
            cbr:
              value:
                error:
                  code: cbr_unavailable
                  message: Bank of Russia currency data is temporarily unavailable
    InvalidSymbol:
      description: Symbol is malformed or unsupported (HTTP 400).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: invalid_symbol
              message: Symbol is malformed or unsupported
    HistoryStoreUnavailable:
      description: History could not be read from or saved to the persistent history store (HTTP 503).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: history_store_unavailable
              message: Ticker history is temporarily unavailable
    MoexUpstreamUnavailable:
      description: MOEX ISS metadata, history, or current-marketdata lookup failed or returned unusable data (HTTP 502); retains the existing `moex_unavailable` code. A valid but unrecognized MOEX instrument returns HTTP 400 instead.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: moex_unavailable
              message: MOEX market data is temporarily unavailable
    SpbexUpstreamUnavailable:
      description: SPBEX failed or returned unusable data (HTTP 502); retains the existing `spbex_unavailable` code.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: spbex_unavailable
              message: SPBEX market data is temporarily unavailable
    CbrUpstreamUnavailable:
      description: Bank of Russia failed or returned unusable data (HTTP 502); retains the existing `cbr_unavailable` code.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: cbr_unavailable
              message: Bank of Russia currency data is temporarily unavailable
